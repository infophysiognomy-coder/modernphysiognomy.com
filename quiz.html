<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="10問で今の自分のFACE STAGEを知る無料セルフ診断。">
<title>FACE STAGE｜無料セルフ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=EB+Garamond:ital,wght@1,400&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141210;--surface:#1E1A16;--text:#F0E8DC;
  --muted:#8C7C6C;--gold:#C9AA78;--border:#2E2820;
  --s01:#E8C4BC;--s02:#D8A498;--s03:#C4847A;
  --s04:#B07890;--s05:#8C5878;--s06:#6B4068;
}
html,body{height:100%;background:var(--bg)}
body{color:var(--text);font-family:'Noto Sans JP',sans-serif;font-weight:300;line-height:1.7;min-height:100%;display:flex;flex-direction:column}
.home-link{position:fixed;z-index:20;top:20px;left:24px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.2em;text-decoration:none;text-transform:uppercase;transition:color .2s}
.home-link:hover{color:var(--gold)}

/* SCREENS */
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;padding:40px 24px;text-align:center}
.screen.active{display:flex}

/* ── INTRO ── */
.intro-wordmark{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.45em;text-transform:uppercase;color:var(--gold);margin-bottom:52px}
.intro-title{font-family:'Noto Serif JP',serif;font-weight:300;font-size:clamp(22px,4.5vw,36px);line-height:1.7;text-wrap:balance;margin-bottom:20px;max-width:440px}
.intro-lead{font-size:13px;color:var(--muted);line-height:2;max-width:380px;margin-bottom:48px;text-wrap:balance}
.intro-meta{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:28px;opacity:.7}
.btn-start{display:inline-block;padding:16px 60px;background:var(--gold);color:#141210;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;border:none;cursor:pointer;transition:opacity .2s}
.btn-start:hover{opacity:.84}

/* ── QUIZ ── */
.quiz-screen{align-items:stretch;text-align:left;padding:0}
.quiz-progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--border);z-index:10}
.quiz-progress-fill{height:100%;background:var(--gold);transition:width .4s ease}
.quiz-inner{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:600px;width:100%;margin:0 auto;padding:64px 24px 40px}
.quiz-counter{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.4em;color:var(--gold);margin-bottom:20px;text-transform:uppercase}
.quiz-question{font-family:'Noto Serif JP',serif;font-weight:300;font-size:clamp(17px,3.2vw,22px);line-height:1.75;text-wrap:balance;margin-bottom:32px;color:var(--text)}
.quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:32px}
.opt-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:18px 20px;text-align:left;font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:300;line-height:1.75;cursor:pointer;transition:border-color .18s,background .18s;display:flex;align-items:flex-start;gap:14px}
.opt-letter{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.15em;color:var(--gold);flex-shrink:0;padding-top:3px;width:14px;opacity:.7}
.opt-btn:hover{border-color:rgba(201,170,120,.4);background:rgba(201,170,120,.04)}
.opt-btn.selected{border-color:var(--gold);background:rgba(201,170,120,.1)}
.quiz-nav{display:flex;align-items:center;justify-content:space-between}
.btn-back{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:8px 0;letter-spacing:.12em;font-family:'DM Sans',sans-serif;transition:color .2s;text-transform:uppercase}
.btn-back:hover{color:var(--text)}
.btn-back:disabled{opacity:.25;cursor:default}
.btn-next{background:none;border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.25em;padding:11px 28px;cursor:pointer;transition:border-color .18s,color .18s;text-transform:uppercase}
.btn-next:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.btn-next:disabled{opacity:.25;cursor:default}

/* ── RESULT ── */
.result-screen{gap:0}
.result-eyebrow{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-bottom:36px}
.result-num{font-family:'DM Sans',sans-serif;font-size:clamp(88px,20vw,148px);font-weight:600;letter-spacing:-.06em;line-height:.88;color:var(--rc,var(--gold));margin-bottom:22px}
.result-en{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.55em;text-transform:uppercase;color:var(--rc,var(--gold));margin-bottom:10px}
.result-jp{font-family:'Noto Serif JP',serif;font-weight:400;font-size:18px;letter-spacing:.3em;color:var(--text);margin-bottom:32px}
.result-divider{width:32px;height:1px;background:var(--border);margin:0 auto 32px}
.result-desc{font-size:13.5px;line-height:2.1;color:rgba(240,232,220,.72);max-width:420px;margin-bottom:44px;text-wrap:balance;text-align:left;border-left:2px solid var(--rc,var(--gold));padding-left:18px}
.result-gap-box{background:var(--surface);border:1px solid var(--border);padding:24px 28px;max-width:400px;margin-bottom:40px;text-align:left}
.result-gap-label{font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:block}
.result-gap-text{font-size:12.5px;line-height:1.9;color:var(--muted)}
.result-gap-text strong{color:var(--text);font-weight:400}
.btn-book{display:inline-block;padding:16px 52px;background:var(--rc,var(--gold));color:#141210;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;border:none;cursor:pointer;text-decoration:none;transition:opacity .2s;margin-bottom:14px}
.btn-book:hover{opacity:.84}
.btn-retry{background:none;border:none;font-size:11px;color:var(--muted);cursor:pointer;font-family:'Noto Sans JP',sans-serif;text-decoration:underline;text-underline-offset:3px;transition:color .2s;margin-top:6px;display:block}
.btn-retry:hover{color:var(--text)}

@media(max-width:480px){
  .quiz-inner{padding:60px 20px 32px}
  .opt-btn{padding:15px 16px;font-size:12px}
}
</style>
</head>
<body>

<a class="home-link" href="index.html">← Face Stage</a>

<!-- INTRO -->
<div id="screen-intro" class="screen active">
  <div class="intro-wordmark">Face Stage™ — Self Diagnosis</div>
  <h1 class="intro-title">あなたの顔は今、<br>どのSTAGEにいますか？</h1>
  <p class="intro-lead">年齢ではなく、今の自分がどのように感じているか。10問の質問に答えて、あなたのFACE STAGEを見つけてください。</p>
  <p class="intro-meta">全10問 ／ 所要時間 約5分</p>
  <button class="btn-start" onclick="startQuiz()">診断をはじめる</button>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen quiz-screen">
  <div class="quiz-progress"><div class="quiz-progress-fill" id="progress-fill"></div></div>
  <div class="quiz-inner">
    <div class="quiz-counter" id="q-counter"></div>
    <div class="quiz-question" id="q-text"></div>
    <div class="quiz-options" id="q-options"></div>
    <div class="quiz-nav">
      <button class="btn-back" id="btn-back" onclick="prevQuestion()">← 戻る</button>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>次へ →</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen result-screen">
  <div class="result-eyebrow">あなたのFACE STAGEは</div>
  <div class="result-num" id="r-num"></div>
  <div class="result-en" id="r-en"></div>
  <div class="result-jp" id="r-jp"></div>
  <div class="result-divider"></div>
  <div class="result-desc" id="r-desc"></div>
  <div class="result-gap-box">
    <span class="result-gap-label">Stage Gap について</span>
    <p class="result-gap-text">これはあなた<strong>自身が見た</strong>自分のステージです。<br>顔を読む専門家の目には、<strong>違うものが見えているかもしれません</strong>。そのギャップの中に、まだ見えていないあなたの魅力があります。</p>
  </div>
  <a href="menu.html" class="btn-book" id="r-cta">専門家の鑑定を受ける</a>
  <button class="btn-retry" onclick="retryQuiz()">もう一度診断する</button>
</div>

<script>
// ── DATA ──────────────────────────────────────────
// Scores array: [S01, S02, S03, S04, S05, S06]
const questions = [
  {
    q: "今の自分の顔を見て、一番近い感覚はどれですか？",
    opts: [
      { t: "まだよくわからない。なんとなく気になっている", s: [3,1,0,0,0,0] },
      { t: "もっとうまくできるはず、試している途中", s: [0,3,1,0,0,0] },
      { t: "「これが私」という感覚が落ち着いてきた", s: [0,0,2,1,0,0] },
      { t: "変化の予感、または変わりたいという気持ちがある", s: [0,0,0,0,2,1] }
    ]
  },
  {
    q: "美容やメイクへの今の向き合い方に、一番近いのは？",
    opts: [
      { t: "何から始めればいいか、わからない", s: [3,0,0,0,0,0] },
      { t: "自分に合うものを探し中、または試すのが楽しい", s: [0,3,0,0,0,0] },
      { t: "多くのものを試し、自分の定番が決まっている", s: [0,0,2,1,0,0] },
      { t: "今まで合っていたものが合わなくなったと感じる", s: [0,0,0,0,2,1] }
    ]
  },
  {
    q: "自分の「魅力」について、今どんな感覚がありますか？",
    opts: [
      { t: "自分の魅力がよくわからない", s: [3,0,0,0,0,0] },
      { t: "魅力はある気がするが、まだうまく引き出せていない", s: [1,3,0,0,0,0] },
      { t: "自分の魅力を把握していて、活かせている", s: [0,0,2,1,0,0] },
      { t: "今の魅力より、まだ先があるという感覚", s: [0,0,0,1,1,2] }
    ]
  },
  {
    q: "他の人から、自分の「印象」について言われるとしたら？",
    opts: [
      { t: "意外な指摘や、予想外のことを言われることが多い", s: [2,1,0,0,1,0] },
      { t: "「変わったね」と言われることがある", s: [1,2,0,0,2,0] },
      { t: "「変わらないね」「安定してるね」と言われる", s: [0,0,3,1,0,0] },
      { t: "「雰囲気がある」「存在感がある」と言われる", s: [0,0,0,2,0,3] }
    ]
  },
  {
    q: "朝の支度をするとき、気持ちに一番近いのは？",
    opts: [
      { t: "面倒くさい", s: [3,1,0,0,0,0] },
      { t: "新しいものを試すのが楽しい、実験中", s: [0,3,0,0,1,0] },
      { t: "いつものルーティンがあって、それが心地よい", s: [0,0,2,1,0,0] },
      { t: "最近、いつものやり方が物足りなく感じる", s: [0,0,0,0,3,1] }
    ]
  },
  {
    q: "外見についてアドバイスされることは？",
    opts: [
      { t: "積極的に聞きたい", s: [2,2,0,0,0,0] },
      { t: "参考にして、試したい", s: [0,2,2,0,0,0] },
      { t: "一つの意見として聞くが、必ずしも受け入れるかはわからない", s: [0,0,1,3,0,0] },
      { t: "特に必要だと思わない", s: [0,0,0,2,0,2] }
    ]
  },
  {
    q: "外見や自分らしさについて、近い感覚は？",
    opts: [
      { t: "自分も他人も美醜を無意識にジャッジしてしまう", s: [2,2,0,0,0,0] },
      { t: "他人からの評価が気になる", s: [0,3,1,0,0,0] },
      { t: "経験や年齢と共に自分らしさが出てきた", s: [0,0,2,2,0,0] },
      { t: "常に自分が自分をどう思うかを大切にしている", s: [0,0,0,2,0,2] }
    ]
  },
  {
    q: "憧れる人は？",
    opts: [
      { t: "美人でスタイルの良い人", s: [3,1,0,0,0,0] },
      { t: "幸せな家庭を築いている人", s: [0,2,2,0,0,0] },
      { t: "バランス感覚のある人", s: [0,0,1,2,1,0] },
      { t: "自立していて知的な人", s: [0,0,0,1,0,3] }
    ]
  },
  {
    q: "自分の顔に「これまでの人生」が出てきていると感じますか？",
    opts: [
      { t: "まだそういう実感はない", s: [2,2,0,0,0,0] },
      { t: "少し感じ始めているかもしれない", s: [0,1,2,1,0,0] },
      { t: "感じる。昔の方が良かったかも、と思う", s: [0,0,0,1,2,0] },
      { t: "強く感じる。良くも悪くも自分の顔に対して肯定感がある", s: [0,0,0,2,0,2] }
    ]
  },
  {
    q: "最後に、今の自分を直感で一言で表すなら？",
    opts: [
      { t: "「模索」——まだ、答えを探している途中", s: [2,1,0,0,0,0] },
      { t: "「前進」——試して、つくって、前に進んでいる", s: [0,2,1,0,1,0] },
      { t: "「内観」——自分と向き合い、観察している", s: [0,0,1,2,0,0] },
      { t: "「変容」——変化してきたし、これからも変化すると思う", s: [0,0,0,0,2,2] }
    ]
  }
];

const stages = [
  {
    num:"01", en:"AWAKENING", jp:"発 見 期",
    color:"var(--s01)",
    desc:"あなたの顔は、今まさに目覚めようとしています。自分の顔に気づき始めたこの瞬間こそが、変化のスタート地点。あなたの中に眠る魅力は、まだ言葉になっていません。その直感を信じてください。"
  },
  {
    num:"02", en:"BUILDING", jp:"構 築 期",
    color:"var(--s02)",
    desc:"あなたは今、自分の顔を手でつくっている真っ最中。試行錯誤の中にこそ、あなた固有の美しさが宿っています。その探求心と行動力は、変化を生み出す最大の武器です。"
  },
  {
    num:"03", en:"GROUNDING", jp:"確 立 期",
    color:"var(--s03)",
    desc:"あなたは「これが私」という揺るぎない軸を持っています。自分のスタイルに安定感がある。ただ、その先に何かを感じ始めているかもしれません。その感覚は、次の扉が開こうとしているサインかもしれません。"
  },
  {
    num:"04", en:"OWNING", jp:"肯 定 期",
    color:"var(--s04)",
    desc:"あなたは今の自分の顔を、まるごと受け入れています。焦りでも諦めでもなく、「これが私だ」という静かな確信がある。その深い自己受容こそが、あなたの顔の最大の魅力です。"
  },
  {
    num:"05", en:"TURNING", jp:"転 換 期",
    color:"var(--s05)",
    desc:"あなたは今、変化の予感の中にいます。今の自分と、なりたい自分がゆれている。そのゆらぎは弱さではありません。次のステージへの入口に立っているのです。"
  },
  {
    num:"06", en:"BLOOMING", jp:"昇 華 期",
    color:"var(--s06)",
    desc:"あなたの顔は、人生を語り始めています。積み重ねてきたものが、美しさになっています。努力しなくても存在感がある。その輝きをまだ言葉にできていないとしたら、それがTOMOの鑑定の出番です。"
  }
];

// ── STATE ─────────────────────────────────────────
let current = 0;
let answers = new Array(questions.length).fill(null);

// ── SCREENS ──────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// ── QUIZ LOGIC ────────────────────────────────────
function startQuiz() {
  current = 0;
  answers = new Array(questions.length).fill(null);
  renderQuestion();
  showScreen('screen-quiz');
}

function renderQuestion() {
  const q = questions[current];
  const total = questions.length;

  document.getElementById('q-counter').textContent = `Question ${current+1} / ${total}`;
  document.getElementById('q-text').textContent = q.q;

  const fill = document.getElementById('progress-fill');
  fill.style.width = ((current / total) * 100) + '%';

  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  const letters = ['A','B','C','D'];

  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (answers[current] === i ? ' selected' : '');
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt.t}</span>`;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });

  document.getElementById('btn-back').disabled = (current === 0);
  document.getElementById('btn-next').disabled = (answers[current] === null);

  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = (current === total - 1) ? '結果を見る →' : '次へ →';
}

function selectAnswer(idx) {
  answers[current] = idx;
  document.querySelectorAll('.opt-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  document.getElementById('btn-next').disabled = false;
}

function nextQuestion() {
  if (answers[current] === null) return;
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

// ── SCORING ───────────────────────────────────────
function showResult() {
  const totals = [0,0,0,0,0,0];
  answers.forEach((ans, qi) => {
    if (ans === null) return;
    const s = questions[qi].opts[ans].s;
    s.forEach((v, si) => { totals[si] += v; });
  });

  // Find winning stage (highest score, ties go to earlier stage)
  let maxIdx = 0;
  for (let i = 1; i < 6; i++) {
    if (totals[i] > totals[maxIdx]) maxIdx = i;
  }

  const st = stages[maxIdx];
  document.getElementById('r-num').textContent  = st.num;
  document.getElementById('r-en').textContent   = st.en;
  document.getElementById('r-jp').textContent   = st.jp;
  document.getElementById('r-desc').textContent = st.desc;

  // Apply stage color as CSS variable on result screen
  const el = document.getElementById('screen-result');
  el.style.setProperty('--rc', st.color);

  document.getElementById('progress-fill').style.width = '100%';
  showScreen('screen-result');
}

function retryQuiz() {
  startQuiz();
}
</script>
</body>
</html>
